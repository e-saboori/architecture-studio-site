<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact ECONSET Design to book an initial consultation." />
    <title>Contact | ECONSET Design</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <div class="site-shell">
      <header data-site-header></header>
      <main data-page-content>
        <section class="page-hero contact-hero">
          <div>
            <h1>Book a consultation</h1>
            <p class="contact-hero-copy"><span>Share a few details about your project and I will follow up</span><span>with the next step.</span></p>
          </div>
          <img src="assets/contact-exterior.jpg" alt="Modern concrete exterior with warm wood entry" />
        </section>

        <section class="section contact-grid reveal" id="consultation">
          <div class="contact-details">
            <div class="contact-photo-frame">
              <img src="assets/drafting-pencil.jpg" alt="Architectural drafting pencil and sketch" />
            </div>
            <div class="contact-list">
              <a class="contact-item" href="mailto:Ehsan.ghassemlou@gmail.com">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16v12H4z" /><path d="m4 7 8 6 8-6" /></svg>
                <span>Ehsan.ghassemlou@gmail.com</span>
              </a>
              <a class="contact-item" href="tel:+16474607907">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4h4l2 5-3 2c1.2 2.4 2.9 4.1 5 5l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 6c0-1 1-2 2-2h2z" /></svg>
                <span>+1 (647) 460-7907</span>
              </a>
              <a class="contact-item" href="https://www.google.com/maps/search/?api=1&amp;query=17%20Anndale%20Drive%2C%20Toronto%2C%20ON%2C%20Canada" target="_blank" rel="noreferrer">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z" /><path d="M12 10.5h.01" /></svg>
                <span>17 Anndale Drive, Toronto, ON, Canada</span>
              </a>
            </div>
          </div>

          <form class="contact-form">
            <label><span>Name</span><input type="text" name="name" autocomplete="name" placeholder="Your full name" required /></label>
            <label><span>Phone</span><input type="tel" name="phone" autocomplete="tel" placeholder="Your phone number" /></label>
            <label><span>Email</span><input type="email" name="email" autocomplete="email" placeholder="Your email address" /></label>
            <label><span>Message</span><textarea name="message" rows="6" placeholder="Tell us about your project..." required></textarea></label>
            <button class="button" type="submit"><span>Book a Consultation</span></button>
          </form>
        </section>
      </main>
      <footer data-site-footer></footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
