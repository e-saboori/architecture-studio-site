<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact ECONSET Design to book an initial consultation." />
    <title>Contact | ECONSET Design</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <div class="site-shell">
      <header data-site-header></header>
      <main data-page-content>
        <section class="page-hero contact-hero">
          <div>
            <h1>Book a consultation</h1>
            <p class="contact-hero-copy"><span>Share a few details about your project and I will follow up</span><span>with the next step.</span></p>
          </div>
          <img src="assets/contact-exterior.jpg" alt="Modern concrete exterior with warm wood entry" />
        </section>

        <section class="section contact-grid consultation-layout reveal" id="consultation">
          <div class="contact-details consultation-copy-panel">
            <div class="contact-photo-frame contact-photo-large">
              <img src="assets/drafting-pencil.jpg" alt="Architectural drafting pencil and sketch" />
            </div>
            <div class="consultation-copy">
              <h2>Let's bring your ideas to life.</h2>
              <p>Share a few details about your project and I'll get back to you to discuss the next steps.</p>
            </div>
            <div class="contact-list consultation-benefits" aria-label="Consultation benefits">
              <p class="contact-item">
                <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
                <span>Quick response</span>
              </p>
              <p class="contact-item">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16v11H8l-4 3V6z" /><path d="M8 11h.01M12 11h.01M16 11h.01" /></svg>
                <span>Personalized advice</span>
              </p>
              <p class="contact-item">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.8 7.8 7 10 4.2-2.2 7-5.5 7-10V6l-7-3z" /><path d="m9 12 2 2 4-5" /></svg>
                <span>Confidential &amp; secure</span>
              </p>
            </div>
          </div>

          <form id="consultation-form" class="contact-form consultation-form" action="https://formspree.io/f/xvznpneg" method="POST" novalidate>
            <input type="hidden" name="_subject" value="New Consultation Request from ECONSET Website" />
            <label><span>Name</span><input type="text" name="name" autocomplete="name" placeholder="Your full name" required /></label>
            <label><span>Phone</span><input type="tel" name="phone" autocomplete="tel" placeholder="Your phone number" /></label>
            <label><span>Email</span><input type="email" name="email" autocomplete="email" placeholder="Your email address" /></label>
            <label><span>Message</span><textarea name="message" rows="6" placeholder="Tell us about your project..." required></textarea></label>
            <p id="form-error" class="form-error" aria-live="polite"></p>
            <button class="button consultation-submit" type="submit"><span>Book a Consultation</span></button>
          </form>
        </section>
      </main>
      <footer data-site-footer></footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
