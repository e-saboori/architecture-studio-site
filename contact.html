<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact ECONSET Design to book an initial consultation." />
    <title>Contact | ECONSET Design</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <div class="site-shell">
      <header data-site-header></header>
      <main data-page-content>
        <section class="page-hero contact-hero">
          <div>
            <h1>Book a consultation</h1>
            <p class="contact-hero-copy"><span>Share a few details about your project and I will follow up</span><span>with the next step.</span></p>
          </div>
          <img src="assets/contact-exterior.jpg" alt="Modern concrete exterior with warm wood entry" />
        </section>
        <section class="section contact-grid consultation-section reveal">
          <div class="consultation-intro">
            <div class="consultation-mark" aria-hidden="true">
              <svg viewBox="0 0 72 72">
                <path d="M20 52h34" />
                <path d="M25 52V31l17-12 17 12v21" />
                <path d="M42 19v33" />
                <path d="M25 31l17 8 17-8" />
                <path d="M17 52h4M56 52h4M42 13v-5M61 31h5M18 31h-5" />
              </svg>
            </div>
            <div class="consultation-copy">
              <h2>Let’s bring your ideas to life.</h2>
              <p>Share a few details about your project and I’ll get back to you to discuss the next steps.</p>
            </div>
            <div class="consultation-benefits" aria-label="Consultation benefits">
              <p>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 7v5l3 2" /><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" /></svg>
                <span>Quick response</span>
              </p>
              <p>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z" /><path d="M8 10h.01M12 10h.01M16 10h.01" /></svg>
                <span>Personalized advice</span>
              </p>
              <p>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6l-7-3z" /><path d="m9 12 2 2 4-5" /></svg>
                <span>Confidential & secure</span>
              </p>
            </div>
          </div>
          <form class="contact-form">
            <label><span>Name</span><input type="text" name="name" autocomplete="name" placeholder="Your full name" required /></label>
            <label><span>Phone</span><input type="tel" name="phone" autocomplete="tel" placeholder="Your phone number" /></label>
            <label><span>Email</span><input type="email" name="email" autocomplete="email" placeholder="Your email address" /></label>
            <label><span>Message</span><textarea name="message" rows="6" placeholder="Tell us about your project..." required></textarea></label>
            <button class="button consultation-submit" type="submit"><span>Book a Consultation</span><span aria-hidden="true">→</span></button>
          </form>
        </section>
      </main>
      <footer data-site-footer></footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
