<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact ECONSET Design to book an initial consultation." />
    <title>Contact | ECONSET Design</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="ECONSET Design home">
        <span>ECONSET</span>
        <span>DESIGN</span>
      </a>
      <nav class="nav" aria-label="Primary navigation" data-nav>
        <a href="index.html" data-nav-link="home">Home</a>
        <a href="services.html" data-nav-link="services">Services</a>
        <a href="about.html" data-nav-link="about">About</a>
        <a href="process.html" data-nav-link="process">Process</a>
        <a href="contact.html" data-nav-link="contact">Contact</a>
      </nav>
      <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" data-menu-button>
        <span></span>
        <span></span>
      </button>
    </header>

    <main>
      <section class="page-hero contact-hero">
        <p class="section-label">Contact</p>
        <h1>Book a consultation.</h1>
        <p>Share a few details about your project and I will follow up with the next step.</p>
      </section>

      <section class="section contact-grid">
        <div class="contact-details">
          <a href="mailto:Ehsan.ghassemlou@gmail.com">Ehsan.ghassemlou@gmail.com</a>
          <a href="tel:+16474607907">+1 (647) 460-7907</a>
          <p>17 Anndale Drive, Toronto, ON, Canada</p>
        </div>

        <form class="contact-form">
          <label>
            <span>Name</span>
            <input type="text" name="name" autocomplete="name" />
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" />
          </label>
          <label>
            <span>Project Type</span>
            <input type="text" name="project" />
          </label>
          <label>
            <span>Message</span>
            <textarea name="message" rows="6"></textarea>
          </label>
          <button class="button" type="submit">Send Inquiry</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 ECONSET Design</p>
      <a href="mailto:Ehsan.ghassemlou@gmail.com">Ehsan.ghassemlou@gmail.com</a>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
