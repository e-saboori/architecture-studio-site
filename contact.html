<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact ECONSET Design to book an initial consultation." />
    <title>Contact | ECONSET Design</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <div class="site-shell">
      <header data-site-header></header>
      <main data-page-content>
        <section class="page-hero contact-hero">
          <div>
            <h1>Book a consultation</h1>
            <p class="contact-hero-copy"><span>Share a few details about your project and I will follow up</span><span>with the next step.</span></p>
          </div>
          <img src="assets/contact-exterior.jpg" alt="Modern concrete exterior with warm wood entry" />
        </section>
        <section class="section contact-grid reveal">
          <form class="contact-form">
            <label><span>Name</span><input type="text" name="name" autocomplete="name" required /></label>
            <label><span>Phone</span><input type="tel" name="phone" autocomplete="tel" /></label>
            <label><span>Email</span><input type="email" name="email" autocomplete="email" /></label>
            <label><span>Message</span><textarea name="message" rows="6" required></textarea></label>
            <button class="button" type="submit">Book a Consultation</button>
          </form>
        </section>
      </main>
      <footer data-site-footer></footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
